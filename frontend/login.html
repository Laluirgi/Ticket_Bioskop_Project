<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CinemaTix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0F172A;
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            background:#1E293B;
            border:none;
            border-radius:20px;
            padding:30px;
            box-shadow:0 0 20px rgba(0,0,0,.5);
        }

        .logo{
            color:#FBBF24;
            font-weight:bold;
            text-align:center;
            font-size:32px;
            margin-bottom:20px;
        }

        .form-control{
            background:#334155;
            border:none;
            color:white;
        }

        .form-control:focus{
            background:#475569;
            color:white;
            box-shadow:none;
        }

        .btn-login{
            background:#FBBF24;
            color:black;
            font-weight:bold;
        }

        .btn-login:hover{
            background:#f59e0b;
        }

        a{
            color:#FBBF24;
            text-decoration:none;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="login-card">

                <div class="logo">
                    🎬 CinemaTix
                </div>

                <h3 class="text-center mb-4">
                    Login Account
                </h3>

                <form>

                    <div class="mb-3">
                        <label>Email</label>
                        <input
                        type="email"
                        class="form-control"
                        placeholder="Masukkan Email">
                    </div>

                    <div class="mb-4">
                        <label>Password</label>
                        <input
                        type="password"
                        class="form-control"
                        placeholder="Masukkan Password">
                    </div>

                    <a href="user/dashboard.html" class="btn btn-warning w-100">
    Login
</a>

                </form>

                <p class="text-center mt-4">
                    Belum punya akun?
                    <a href="register.html">
                        Register
                    </a>
                </p>

                <div class="text-center">
                    <a href="index.html">
                        ← Kembali ke Home
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
