<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Ticket - CinemaTix</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0F172A;
    color:white;
}

.navbar{
    background:#1E293B;
}

.navbar-brand{
    color:#FBBF24 !important;
    font-weight:bold;
}

.ticket-card{
    background:#1E293B;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

.ticket-header{
    text-align:center;
}

.ticket-code{
    background:#FBBF24;
    color:black;
    font-weight:bold;
    padding:10px;
    border-radius:10px;
    display:inline-block;
}

.btn-home{
    background:#FBBF24;
    color:black;
    font-weight:bold;
}

.success-icon{
    font-size:70px;
}

</style>

</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            🎬 CinemaTix
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="ticket-card">

                <div class="ticket-header">

                    <div class="success-icon">
                        ✅
                    </div>

                    <h2>Pembayaran Berhasil</h2>

                    <p>
                        E-Ticket Anda telah berhasil dibuat
                    </p>

                    <div class="ticket-code" id="bookingCode">
                        CTX0001
                    </div>

                </div>

                <hr>

                <p>
                    <strong>Film :</strong>
                    <span id="filmName"></span>
                </p>

                <p>
                    <strong>Studio :</strong>
                    <span id="studioName"></span>
                </p>

                <p>
                    <strong>Tanggal :</strong>
                    <span id="tanggalFilm"></span>
                </p>

                <p>
                    <strong>Jam :</strong>
                    <span id="jamFilm"></span>
                </p>

                <p>
                    <strong>Kursi :</strong>
                    <span id="seatNumber"></span>
                </p>

                <p>
                    <strong>Total Bayar :</strong>
                    Rp <span id="hargaTiket"></span>
                </p>

                <hr>

                <div class="text-center">

                    <h5>🎟 Tunjukkan tiket ini saat masuk studio</h5>

                    <a href="../index.html"
                       class="btn btn-home mt-3">
                        Kembali ke Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

document.getElementById("filmName").innerText =
params.get("film") || "-";

document.getElementById("studioName").innerText =
params.get("studio") || "-";

document.getElementById("tanggalFilm").innerText =
params.get("tanggal") || "-";

document.getElementById("jamFilm").innerText =
params.get("jam") || "-";

document.getElementById("seatNumber").innerText =
params.get("kursi") || "-";

const harga =
params.get("harga") || "0";

document.getElementById("hargaTiket").innerText =
Number(harga).toLocaleString("id-ID");

const randomCode =
"CTX" +
Math.floor(
1000 + Math.random() * 9000
);

document.getElementById("bookingCode")
.innerText = randomCode;

</script>

</body>
</html>
