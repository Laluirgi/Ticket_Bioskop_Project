<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CinemaTix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0F172A;
            color:white;
        }

        .register-card{
            background:#1E293B;
            border:none;
            border-radius:20px;
            padding:30px;
            margin-top:40px;
            margin-bottom:40px;
        }

        .logo{
            color:#FBBF24;
            font-weight:bold;
            text-align:center;
            font-size:32px;
            margin-bottom:20px;
        }

        .form-control{
            background:#334155;
            border:none;
            color:white;
        }

        .form-control:focus{
            background:#475569;
            color:white;
            box-shadow:none;
        }

        .btn-register{
            background:#FBBF24;
            color:black;
            font-weight:bold;
        }

        a{
            color:#FBBF24;
            text-decoration:none;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="register-card">

                <div class="logo">
                    🎬 CinemaTix
                </div>

                <h3 class="text-center mb-4">
                    Create Account
                </h3>

                <form>

                    <div class="mb-3">
                        <label>Nama Lengkap</label>
                        <input
                        type="text"
                        class="form-control"
                        placeholder="Nama Lengkap">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input
                        type="email"
                        class="form-control"
                        placeholder="Email">
                    </div>

                    <div class="mb-3">
                        <label>No HP</label>
                        <input
                        type="text"
                        class="form-control"
                        placeholder="Nomor HP">
                    </div>

                    <div class="mb-3">
                        <label>Alamat</label>
                        <textarea
                        class="form-control"
                        rows="3"></textarea>
                    </div>

                    <div class="mb-4">
                        <label>Password</label>
                        <input
                        type="password"
                        class="form-control"
                        placeholder="Password">
                    </div>

                    <button
                    type="submit"
                    class="btn btn-register w-100">
                        Register
                    </button>

                </form>

                <p class="text-center mt-4">
                    Sudah punya akun?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
